<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f1"><title>景物不是被罗列出来的｜三篇文本中的写景节奏</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fff8f1;color:#24313a;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.loading{padding:28px;text-align:center}.dot{width:42px;height:42px;margin:0 auto 18px;border:4px solid #ffd7bd;border-top-color:#f15b40;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.error{max-width:680px;line-height:1.8;padding:24px}</style></head><body><div class="loading"><div class="dot"></div><strong>正在打开互动共读页面……</strong></div><script>(async()=>{try{const b64=(await (await fetch('./page-0.txt',{cache:'no-store'})).text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('当前浏览器不支持页面解压，请使用最新版 Chrome、Edge 或 Safari。');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="error"><h2>页面暂时无法打开</h2><p>'+e.message+'</p><p>请刷新页面，或改用最新版 Chrome、Edge、Safari 浏览器。</p></div>'}})();</script></body></html>
