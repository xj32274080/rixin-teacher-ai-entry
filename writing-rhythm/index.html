<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f1"><title>景物不是被罗列出来的｜三篇文本中的写景节奏</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fff8f1;color:#24313a;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.loading,.error{max-width:680px;padding:28px;text-align:center;line-height:1.8}.dot{width:42px;height:42px;margin:0 auto 18px;border:4px solid #ffd7bd;border-top-color:#f15b40;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;padding:11px 18px;background:#24313a;color:#fff;font:inherit;font-weight:700;cursor:pointer}</style></head><body><div class="loading"><div class="dot"></div><strong>正在打开互动共读页面……</strong><div id="status">正在读取页面内容</div></div><script>(async()=>{const urls=['./page-0.txt','https://raw.githubusercontent.com/xj32274080/rixin-teacher-ai-entry/main/writing-rhythm/page-0.txt','https://cdn.jsdelivr.net/gh/xj32274080/rixin-teacher-ai-entry@main/writing-rhythm/page-0.txt'];const status=document.getElementById('status');try{let b64='';let lastError='';for(let i=0;i<urls.length;i++){try{status.textContent='正在尝试加载通道 '+(i+1)+' / '+urls.length;const res=await fetch(urls[i],{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const text=(await res.text()).trim();if(!text.startsWith('H4sI'))throw new Error('返回内容格式不正确');b64=text;break}catch(err){lastError=err.message}}if(!b64)throw new Error(lastError||'无法读取页面内容');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('当前浏览器不支持页面解压，请使用最新版 Chrome、Edge 或 Safari。');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="error"><h2>页面暂时无法打开</h2><p>'+e.message+'</p><p>请点击重试；若仍失败，可稍后再打开。</p><button onclick="location.reload()">重新加载</button></div>'}})();</script></body></html>
